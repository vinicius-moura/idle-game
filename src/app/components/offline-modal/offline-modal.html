<app-modal *ngIf="gameService.offlineGains() !== null" (close)="gameService.dismissOfflineGains()">
  <h3>⚓ {{ 'offline.title' | translate }}</h3>
  <p>{{ 'offline.message' | translate }}</p>
  <p class="offline-amount">
    +{{ gameService.offlineGains()! | formatNumber }} {{ 'game.reputation' | translate }}
  </p>
  <button (click)="gameService.dismissOfflineGains()">{{ 'offline.claim' | translate }}</button>
</app-modal>
