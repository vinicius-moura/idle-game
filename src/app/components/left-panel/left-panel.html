<div class="left-panel-buttons">
  @if (hasCrewSlots) {
    <button class="left-panel-btn crew" [class.active]="crewOpen()" [attr.aria-pressed]="crewOpen()" (click)="crewOpen.set(true)">
      {{ 'panel.crew' | translate }}
    </button>
  }
  <button class="left-panel-btn prestige" [class.active]="prestigeOpen()" [attr.aria-pressed]="prestigeOpen()" (click)="prestigeOpen.set(true)">
    {{ 'panel.prestige' | translate }}
  </button>
</div>

<app-crew [isOpen]="crewOpen()" (close)="crewOpen.set(false)"></app-crew>
<app-prestige [isOpen]="prestigeOpen()" (close)="prestigeOpen.set(false)"></app-prestige>
