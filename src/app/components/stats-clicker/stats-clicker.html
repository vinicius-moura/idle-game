<div class="stats-container">
    <div class="reputation-display">
        {{ state().reputation | formatNumber }}
    </div>
    <div class="rps-display-container">
        <p>{{ reputationPerSecondWithCrew | formatNumber }}</p> {{ 'game.perSecond' | translate }}
    </div>
</div>

<div class="clicker-area">
    <button id="clicker-btn" class="clicker-btn" (click)="onBtnClick()">
        <img [src]="shipImages[state().currentShip]" class="ship-img" [attr.alt]="'ship.' + state().currentShip | translate">
    </button>
    
    @for (float of floatingTexts; track float.id) {
        <div class="floating-text" [style.left.%]="float.x">
            {{ float.text }}
        </div>
    }
</div>
